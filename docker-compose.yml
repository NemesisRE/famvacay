# ==============================================================================
# Hardened Docker Compose Configuration for FamVacay
# Architecture:
# - backend-internal: bridge, internal: true (zero host exposure or unauthorized outbound)
# - proxy-network: external reverse proxy network (only web joins)
# - One-shot migration service running from the migrator image
# ==============================================================================

services:
  # One-shot database migration service
  migrate:
    # Released image (FAMVACAY_VERSION: 1 = latest 1.x); `docker compose up --build` builds it from
    # this checkout instead, and Compose also builds when the image cannot be pulled.
    image: ghcr.io/nemesisre/famvacay-migrator:${FAMVACAY_VERSION:-1}
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: famvacay-migrate
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-famvacay}:${POSTGRES_PASSWORD:-famvacay_secure_password}@postgres:5432/${POSTGRES_DB:-famvacay_db}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-internal
    restart: "no"

  # Application runtime service
  web:
    image: ghcr.io/nemesisre/famvacay:${FAMVACAY_VERSION:-1}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: famvacay-web
    restart: unless-stopped
    expose:
      - "3000"
    # Optional direct host port mapping if reverse proxy runs on host:
    # ports:
    #   - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-famvacay}:${POSTGRES_PASSWORD:-famvacay_secure_password}@postgres:5432/${POSTGRES_DB:-famvacay_db}?schema=public
      - APP_URL=${APP_URL:-http://localhost:3000}
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-1}
      - VALKEY_URL=redis://cache:6379
      - DRAGONFLY_URL=redis://cache:6379
      - REDIS_URL=redis://cache:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-changeme-production-secret-min32chars}
      - NEXTAUTH_URL=${APP_URL:-http://localhost:3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - PHOTON_API_URL=${PHOTON_API_URL:-https://photon.komoot.io/api}
      - OPEN_HOLIDAYS_API_URL=${OPEN_HOLIDAYS_API_URL:-https://openholidaysapi.org}
      - NAGER_DATE_API_URL=${NAGER_DATE_API_URL:-https://date.nager.at/api/v3}
      - LEGAL_OPERATION_MODE=${LEGAL_OPERATION_MODE:-private}
      - LEGAL_OPERATOR_NAME=${LEGAL_OPERATOR_NAME:-}
      - LEGAL_OPERATOR_STREET=${LEGAL_OPERATOR_STREET:-}
      - LEGAL_OPERATOR_POSTAL_CITY=${LEGAL_OPERATOR_POSTAL_CITY:-}
      - LEGAL_OPERATOR_COUNTRY=${LEGAL_OPERATOR_COUNTRY:-Deutschland / Germany}
      - LEGAL_CONTACT_EMAIL=${LEGAL_CONTACT_EMAIL:-}
      - LEGAL_CONTACT_PHONE=${LEGAL_CONTACT_PHONE:-}
      - LEGAL_VAT_ID=${LEGAL_VAT_ID:-}
      - LEGAL_HOSTING_PROVIDER_NAME=${LEGAL_HOSTING_PROVIDER_NAME:-}
      - LEGAL_HOSTING_PROVIDER_ADDRESS=${LEGAL_HOSTING_PROVIDER_ADDRESS:-}
      - LEGAL_DPA_CONCLUDED=${LEGAL_DPA_CONCLUDED:-false}
      - NEXT_PUBLIC_COOKIE_BANNER_MODE=${NEXT_PUBLIC_COOKIE_BANNER_MODE:-TRANSPARENCY_AND_CHOICE}
      - NEXT_PUBLIC_UMAMI_SCRIPT_URL=${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-/stats/script.js}
      - NEXT_PUBLIC_UMAMI_WEBSITE_ID=${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
      - UMAMI_INTERNAL_URL=http://umami:3000
      # Reference data (airports, routes, climate) refreshes itself in the background and is
      # stored in Postgres; set to false to stay on the data bundled in the image.
      - DATASET_AUTO_REFRESH=${DATASET_AUTO_REFRESH:-true}
      # Paid Open-Meteo plan (needed for rain-duration data with LEGAL_OPERATION_MODE=commercial)
      - OPEN_METEO_API_KEY=${OPEN_METEO_API_KEY:-}
      # Optional third-party sign-in (enabled only when both values of a provider are set)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-}
      - APPLE_CLIENT_SECRET=${APPLE_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      cache:
        condition: service_healthy
      umami:
        condition: service_started
    networks:
      - backend-internal
      - proxy-network
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.2"
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/ready', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Database store (PostgreSQL 16 Alpine)
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: famvacay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-famvacay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-famvacay_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-famvacay_db}
      # Separate database for the self-hosted Umami service (scripts/postgres-init/, re-checked on
      # every start by db-init).
      UMAMI_DB: ${UMAMI_DB:-famvacay_umami}
    # No host port mapping: Postgres is reachable only from other containers on
    # backend-internal. For ad-hoc local access use:
    #   docker compose exec postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend-internal
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-famvacay} -d ${POSTGRES_DB:-famvacay_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot: makes sure Umami's database exists on EVERY start. /docker-entrypoint-initdb.d only
  # runs on an empty data volume, so a first start interrupted after initdb left Umami without
  # its database permanently. Same script as the initdb hook, over the network this time.
  db-init:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: famvacay-db-init
    entrypoint: ["/bin/sh", "/docker-entrypoint-initdb.d/01-create-umami-db.sh"]
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-famvacay_secure_password}
      POSTGRES_USER: ${POSTGRES_USER:-famvacay}
      POSTGRES_DB: ${POSTGRES_DB:-famvacay_db}
      UMAMI_DB: ${UMAMI_DB:-famvacay_umami}
    volumes:
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-internal
    user: "70:70" # the image's unprivileged postgres user; psql needs no rights in the container
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # Cache & Rate Limiting store (Valkey / Dragonfly / Redis wire-compatible)
  cache:
    image: valkey/valkey:9-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    container_name: famvacay-cache
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
    # No host port mapping: Valkey is reachable only from other containers on
    # backend-internal. For ad-hoc local access use:
    #   docker compose exec cache valkey-cli
    expose:
      - "6379"
    volumes:
      - cache_data:/data
    networks:
      - backend-internal
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Self-hosted, cookieless analytics (Umami) - reachable via the web container's
  # /stats/* rewrite proxy (next.config.js) and directly by reverse proxies (Pangolin, Traefik, etc.)
  # on proxy-network for the Umami administration dashboard.
  umami:
    image: ghcr.io/umami-software/umami:3.4.1@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8
    container_name: famvacay-umami
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-famvacay}:${POSTGRES_PASSWORD:-famvacay_secure_password}@postgres:5432/${UMAMI_DB:-famvacay_umami}?schema=public
      - APP_SECRET=${UMAMI_APP_SECRET:-changeme-umami-secret-min32chars}
      - DISABLE_TELEMETRY=1
      - DO_NOT_TRACK=1
      - CLIENT_IP_HEADER=X-Forwarded-For
    expose:
      - "3000"
    # Optional direct host port mapping if reverse proxy runs on host:
    # ports:
    #   - "${UMAMI_PORT:-3001}:3000"
    depends_on:
      # Its database must exist before Umami migrates it (created by db-init on every start)
      db-init:
        condition: service_completed_successfully
    networks:
      - backend-internal
      - proxy-network
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/heartbeat', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
    driver: local
  cache_data:
    driver: local

networks:
  # Isolated bridge network for web <-> migrate <-> db <-> cache
  backend-internal:
    driver: bridge
    internal: true

  # External network joined only by web to connect to reverse proxy
  proxy-network:
    external: true
    name: ${PROXY_NETWORK_NAME:-proxy-network}
