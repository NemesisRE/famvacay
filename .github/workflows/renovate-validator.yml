name: Renovate Validator

on:
  pull_request:
    paths:
      - 'renovate.json'
      - '.github/renovate.json'
      - '.github/renovate.json5'
  push:
    branches: [ "main" ]
    paths:
      - 'renovate.json'
      - '.github/renovate.json'
      - '.github/renovate.json5'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Renovate Configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - name: Set up Node.js 26 (Active LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Validate Renovate Config
        run: pnpm dlx --package renovate -- renovate-config-validator --strict renovate.json
