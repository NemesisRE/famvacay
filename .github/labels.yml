# Repository labels, synced by .github/workflows/labels.yml. Labels missing here are kept
# (skip-delete), so labels Renovate creates on its own stay untouched.
#
# Release labels decide the next version in .github/release-drafter.yml:
#   breaking-change -> major, feature / enhancement -> minor, everything else -> patch

# Release: version bump and release notes section
- name: "breaking-change"
  color: "#b60205"
  description: "Incompatible change: next release is a major version"
- name: "feature"
  color: "#0e8a16"
  description: "New functionality: next release is a minor version"
- name: "enhancement"
  color: "#a2eeef"
  description: "New feature or request: next release is a minor version"
- name: "fix"
  color: "#fbca04"
  description: "Bug fix: patch release"
- name: "bug"
  color: "#d73a4a"
  description: "Something isn't working"
- name: "security"
  color: "#ee0701"
  description: "Security fix or hardening: patch release"
- name: "performance"
  color: "#5319e7"
  description: "Faster or leaner: patch release"
- name: "dependencies"
  color: "#0366d6"
  description: "Dependency update: patch release"
- name: "refactor"
  color: "#c5def5"
  description: "Code restructuring without behaviour change: patch release"
- name: "test"
  color: "#bfd4f2"
  description: "Tests only: patch release"
- name: "ci"
  color: "#1d76db"
  description: "CI/CD pipeline changes: patch release"
- name: "chore"
  color: "#ededed"
  description: "Maintenance: patch release"
- name: "documentation"
  color: "#0075ca"
  description: "Improvements or additions to documentation"
- name: "skip-changelog"
  color: "#ffffff"
  description: "Leave this pull request out of the release notes"

# Triage
- name: "accessibility"
  color: "#f143ab"
  description: "Barrier affecting people with disabilities"
- name: "duplicate"
  color: "#cfd3d7"
  description: "This issue or pull request already exists"
- name: "good first issue"
  color: "#7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "#008672"
  description: "Extra attention is needed"
- name: "invalid"
  color: "#e4e669"
  description: "This doesn't seem right"
- name: "question"
  color: "#d876e3"
  description: "Further information is requested"
- name: "wontfix"
  color: "#ffffff"
  description: "This will not be worked on"
