# ==============================================================================
# FamVacay Kubernetes Secrets Template
# NOTE: Template only with placeholder values. Never commit production secrets.
# Compatible with External Secrets Operator (ESO), Sealed Secrets, and Mozilla SOPS.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: famvacay-secrets
  namespace: default
  labels:
    app.kubernetes.io/name: famvacay
type: Opaque
stringData:
  POSTGRES_USER: "famvacay"
  POSTGRES_PASSWORD: "change_this_secret_in_prod"
  POSTGRES_DB: "famvacay_db"
  DATABASE_URL: "postgresql://famvacay:change_this_secret_in_prod@famvacay-postgres:5432/famvacay_db?schema=public"
  NEXTAUTH_SECRET: "changeme-production-secret-min32chars"
  # Paid Open-Meteo plan - required for new rain-duration data when LEGAL_OPERATION_MODE=commercial
  OPEN_METEO_API_KEY: ""
  # SMTP login for outgoing mail (see SMTP_HOST in the ConfigMap)
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  # Optional OAuth Social Login Providers (uncomment and populate to activate)
  # GOOGLE_CLIENT_ID: ""
  # GOOGLE_CLIENT_SECRET: ""
  # APPLE_CLIENT_ID: ""
  # APPLE_CLIENT_SECRET: ""
