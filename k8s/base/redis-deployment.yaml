apiVersion: apps/v1
kind: Deployment
metadata:
  name: famvacay-redis
  namespace: default
  labels:
    app.kubernetes.io/name: famvacay-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: famvacay-redis
  template:
    metadata:
      labels:
        app: famvacay-redis
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: famvacay-redis
  namespace: default
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: famvacay-redis

