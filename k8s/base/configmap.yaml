apiVersion: v1
kind: ConfigMap
metadata:
  name: famvacay-config
  namespace: default
  labels:
    app.kubernetes.io/name: famvacay
data:
  NODE_ENV: "production"
  PORT: "3000"
  APP_URL: "https://famvacay.us"
  TRUST_PROXY: "true"
  TRUSTED_PROXY_HOPS: "1"
  ALLOWED_ORIGINS: "famvacay.us"
  REDIS_URL: "redis://famvacay-redis:6379"
  PHOTON_API_URL: "https://photon.komoot.io/api"
  OPEN_HOLIDAYS_API_URL: "https://openholidaysapi.org"
  NAGER_DATE_API_URL: "https://date.nager.at/api/v3"
  LEGAL_OPERATION_MODE: "private"
  LEGAL_OPERATOR_COUNTRY: "Deutschland / Germany"
  LEGAL_DPA_CONCLUDED: "false"
  NEXT_PUBLIC_COOKIE_BANNER_MODE: "TRANSPARENCY_AND_CHOICE"
  NEXT_PUBLIC_UMAMI_SCRIPT_URL: "/stats/script.js"
  NEXT_PUBLIC_UMAMI_WEBSITE_ID: ""
  UMAMI_INTERNAL_URL: "http://famvacay-umami:3000"
  # Reference data refreshes itself in the background (stored in Postgres, one replica at a time)
  DATASET_AUTO_REFRESH: "true"
  # Outgoing mail (confirmation links, passport reminders); off while SMTP_HOST is empty.
  # SMTP_USER / SMTP_PASSWORD go into the Secret.
  SMTP_HOST: ""
  SMTP_PORT: "587"
  MAIL_FROM: ""
  # LEGAL_OPERATOR_NAME / _STREET / _POSTAL_CITY / LEGAL_CONTACT_EMAIL / LEGAL_HOSTING_PROVIDER_*
  # are intentionally left unset here - src/lib/env.ts falls back to visible bracketed
  # placeholders so the build never fails; set real values via a Kustomize overlay patch.
