apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: famvacay-httproute
  namespace: default
  labels:
    app.kubernetes.io/name: famvacay-web
spec:
  parentRefs:
    - name: eg-gateway
      namespace: default
  hostnames:
    - "famvacay.us"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: famvacay-service
          port: 80

