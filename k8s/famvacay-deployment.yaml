apiVersion: apps/v1
kind: Deployment
metadata:
  name: famvacay-web
  namespace: default
  labels:
    app.kubernetes.io/name: famvacay-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: famvacay-web
  template:
    metadata:
      labels:
        app: famvacay-web
    spec:
      # Init container prevents race conditions during multi-replica rollouts
      initContainers:
        - name: prisma-migrate
          image: famvacay:latest
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: famvacay-config
            - secretRef:
                name: famvacay-secrets
      containers:
        - name: web
          image: famvacay:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: famvacay-config
            - secretRef:
                name: famvacay-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

