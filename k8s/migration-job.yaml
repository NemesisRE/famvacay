apiVersion: batch/v1
kind: Job
metadata:
  name: famvacay-db-migrate
  namespace: default
  labels:
    app.kubernetes.io/name: famvacay-migrate
  annotations:
    # Run before deployment rollouts in GitOps / ArgoCD / Flux
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: famvacay-migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrator
          image: famvacay:migrator
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: famvacay-config
            - secretRef:
                name: famvacay-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

