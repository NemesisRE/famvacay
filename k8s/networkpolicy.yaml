apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: famvacay-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: famvacay-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic from reverse proxy / ingress controller to web port 3000
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    # 1. Allow TCP connection to PostgreSQL (port 5432)
    - to:
        - podSelector:
            matchLabels:
              app: famvacay-postgres
      ports:
        - protocol: TCP
          port: 5432
    # 2. Allow TCP connection to Cache / Redis (port 6379)
    - to:
        - podSelector:
            matchLabels:
              app: famvacay-redis
      ports:
        - protocol: TCP
          port: 6379
    # 3. Allow cluster DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 4. Allow HTTPS egress for external APIs (Photon, OpenHolidays, Open-Meteo)
    - ports:
        - protocol: TCP
          port: 443

