apiVersion: v1
kind: ConfigMap
metadata:
  name: famvacay-config
  namespace: default
  labels:
    app.kubernetes.io/name: famvacay
data:
  NODE_ENV: "production"
  PORT: "3000"
  APP_URL: "https://vacations.example.com"
  TRUST_PROXY: "true"
  TRUSTED_PROXY_HOPS: "1"
  ALLOWED_ORIGINS: "vacations.example.com"
  REDIS_URL: "redis://famvacay-redis:6379"
  PHOTON_API_URL: "https://photon.komoot.io/api"
  OPEN_HOLIDAYS_API_URL: "https://openholidaysapi.org"
  NAGER_DATE_API_URL: "https://date.nager.at/api/v3"
