apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: famvacay-postgres
  namespace: default
  labels:
    app.kubernetes.io/name: famvacay-postgres
  # NOTE: This StatefulSet is provided for standalone self-hosting on single-node clusters.
  # For high-availability production Kubernetes clusters, a managed database (e.g. AWS RDS, GCP Cloud SQL)
  # or a dedicated PostgreSQL operator (such as CloudNative-PG or Zalando Postgres Operator) is strongly preferred.
spec:
  serviceName: famvacay-postgres
  replicas: 1
  selector:
    matchLabels:
      app: famvacay-postgres
  template:
    metadata:
      labels:
        app: famvacay-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: famvacay-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: famvacay-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: famvacay-secrets
                  key: POSTGRES_DB
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "famvacay", "-d", "famvacay_db"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "famvacay", "-d", "famvacay_db"]
            initialDelaySeconds: 10
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: famvacay-postgres
  namespace: default
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: famvacay-postgres
  clusterIP: None

