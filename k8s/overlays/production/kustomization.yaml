apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Separated by namespace, not by a name prefix: the connection strings in the ConfigMap and
# Secret (famvacay-postgres, famvacay-redis, famvacay-umami) are plain values that a prefix
# would not rewrite.
namespace: production

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: famvacay-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
