apiVersion: v1
kind: Secret
metadata:
  name: famvacay-secrets
  namespace: default
  labels:
    app.kubernetes.io/name: famvacay
type: Opaque
stringData:
  POSTGRES_USER: "famvacay"
  POSTGRES_PASSWORD: "change_this_secret_in_prod"
  POSTGRES_DB: "famvacay_db"
  DATABASE_URL: "postgresql://famvacay:change_this_secret_in_prod@famvacay-postgres:5432/famvacay_db?schema=public"
  AMADEUS_CLIENT_ID: ""
  AMADEUS_CLIENT_SECRET: ""

