apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: famvacay-ingress
  namespace: default
  labels:
    app.kubernetes.io/name: famvacay-web
  # Optional: For Traefik Ingress Controller, uncomment the annotations below.
  # Do not target ingress-nginx: it was retired in March 2026.
  # annotations:
  #   traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
  #   traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
    - host: vacations.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: famvacay-service
                port:
                  number: 80
